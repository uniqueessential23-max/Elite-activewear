<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLT | Elite Activewear Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="app">
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <button id="menu-btn" class="icon-btn">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="logo">VOLT</div>
            <button id="cart-btn" class="icon-btn relative">
                <span class="material-symbols-outlined">shopping_bag</span>
                <span id="cart-count" class="badge">0</span>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Screens will be injected here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-screen="home">
                <span class="material-symbols-outlined filled">home</span>
                <span class="label">HOME</span>
            </button>
            <button class="nav-item" data-screen="shop">
                <span class="material-symbols-outlined">search</span>
                <span class="label">SHOP</span>
            </button>
            <button class="nav-item" data-screen="stats">
                <span class="material-symbols-outlined">monitoring</span>
                <span class="label">STATS</span>
            </button>
            <button class="nav-item" data-screen="profile">
                <span class="material-symbols-outlined">person</span>
                <span class="label">PROFILE</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="mockData.js"></script>
    <script src="app.js"></script>
</body>
</html>
